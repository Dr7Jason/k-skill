# foresttrip-watchlist.yaml — 자연휴양림 예약 감시 설정
# 복사 위치: ~/.config/k-skill/foresttrip-watchlist.yaml
# 퍼미션: chmod 600 ~/.config/k-skill/foresttrip-watchlist.yaml

# ────────────────────────────────────────
# 감시 대상 목록
# ────────────────────────────────────────
targets:
  - forest_name: 유명산     # 숲나들e에 표시되는 공식 휴양림명 (부분 일치)
    dates:
      - "20260607"          # 원하는 날짜들 (YYYYMMDD)
      - "20260608"
      - "20260614"
      - "20260615"
    categories:
      - "01"                # 01=숙박, 02=야영/캠핑 (복수 가능)
    room_keywords: []       # 빈 리스트 = 모든 객실 대상
                            # 예: ["황토방", "통나무집"]
    max_capacity: 6         # 최대 수용 인원 초과 객실 제외 (null 이면 무제한)

  - forest_name: 방태산
    dates:
      - "20260621"
      - "20260622"
    categories:
      - "01"
    room_keywords: []
    max_capacity: null      # 인원 제한 없음

# 필요 시 forest_id로도 지정 가능 (forest_name보다 우선):
# - forest_id: "A0000001"
#   dates: ["20260607"]
#   categories: ["01"]

# ────────────────────────────────────────
# 예약자 정보 (예약 폼 자동 입력)
# ────────────────────────────────────────
booker:
  name: "이승제"
  phone: "010-1234-5678"   # 실제 번호로 교체
  people: 2
  payment_method: bank_transfer   # 무통장입금 (현재 유일하게 지원)

# ────────────────────────────────────────
# 알림 설정
# ────────────────────────────────────────
notify:
  kakao:
    enabled: true
    recipient: "나에게 보내기"   # KakaoTalk 검색창에 입력할 이름

  slack:
    enabled: false
    webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

# ────────────────────────────────────────
# 폴링 설정
# ────────────────────────────────────────
poll:
  interval_seconds: 180    # 기본 폴링 간격 (초)
  jitter_seconds: 30       # ±jitter 로 간격 무작위화 (과도한 요청 방지)
  max_book_attempts: 3     # 대상당 최대 예약 시도 횟수

# ────────────────────────────────────────
# 기타
# ────────────────────────────────────────
session_cache: "~/.cache/k-skill/foresttrip-vacancy/session.json"
headless: true             # false 로 하면 브라우저 창이 뜸 (디버깅용)
